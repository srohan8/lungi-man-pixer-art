name: Android build

# Builds the game into an Android app with Capacitor.
#  - Every push to main and every manual run: runs the headless test, builds a debug APK (install it on a phone to try).
#  - If the signing secrets exist (see docs/PLAYSTORE.md): also builds a signed release AAB (the file Google Play wants)
#    and a signed release APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to players (for example 1.0.1)"
        required: false
        default: "1.0"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner already has the Android SDK. Accept its licences so Gradle can download platform 36 if needed.
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Headless test (plays every level)
        run: npm test

      - name: Build web files and sync into the Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pvc=$VERSION_CODE -Pvn=$VERSION_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: lungi-man-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Check for signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decode keystore
        if: steps.signing.outputs.present == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB and APK
        if: steps.signing.outputs.present == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -Pvc=$VERSION_CODE -Pvn=$VERSION_NAME

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.present == 'true'
        with:
          name: lungi-man-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
