<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0818">
<title>Kannan and the Kanjiravanam Chronicles</title>
<style>
:root{--bg:#0b0818;--ink:#f4ecd0;--gold:#f0c040;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pad button.pulse{animation:pulse .9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,192,64,.95)}50%{box-shadow:0 0 0 16px rgba(240,192,64,0)}}
#t{position:fixed;pointer-events:none;image-rendering:auto;z-index:1}
.pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;z-index:2;align-items:flex-end}
#padL{left:calc(max(44px,7vw) + env(safe-area-inset-left,0px))}
#padR{right:calc(max(44px,7vw) + env(safe-area-inset-right,0px))}
body.nopad .pad{display:none}
.pad button{position:relative}
.pad button::after{content:"";position:absolute;inset:-14px}
.pad button{width:68px;height:68px;border-radius:50%;border:2px solid rgba(240,192,64,.75);background:rgba(16,10,34,.38);color:var(--ink);font:700 14px "Trebuchet MS",Verdana,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.pad button.on{background:rgba(240,192,64,.85);color:#140c22}
#bJ{width:78px;height:78px;margin-bottom:24px}
#rot{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--ink);font:700 18px "Trebuchet MS",Verdana,sans-serif;text-align:center;padding:24px}
#rot span{font-size:46px}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (orientation:portrait) and (hover:none){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div><canvas id="t"></canvas>
<div class="pad" id="padL"><button data-k="l" aria-label="Move left">◀</button><button data-k="r" aria-label="Move right">▶</button></div>
<div class="pad" id="padR"><button data-k="s">THROW</button><button data-k="j" id="bJ">JUMP</button></div>
<div id="rot"><span>📱↻</span>Turn your phone sideways to play</div>

<script>
/* =================== setup =================== */
const cv=document.getElementById('c'),g=cv.getContext('2d');
const H=270,GY=210;let W=480;
const isTouch=matchMedia('(hover:none)').matches;

/* =================== input =================== */
const keys={},touch={l:0,r:0,j:0,s:0};
addEventListener('keydown',e=>{if(e.code==='KeyM'){toggleSnd();return}
  if(state==='pages'&&e.code==='Escape'){pagesSkip();return}
  if(state==='play'&&tut&&tut.phase==='msg'&&e.code==='Escape'){tutSkip();return}
  if(e.code==='KeyP'||e.code==='Escape'){if(!e.repeat)togglePause();return}
  if(paused){if(e.code==='Space'||e.code==='Enter')setPause(false);else if(e.code==='KeyQ')pauseToMenu();e.preventDefault();return}
  keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat)startIfNeeded(e.code)});
addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(paused)return;if(tut&&tut.phase==='msg'&&state==='play'){tutConfirm();return}try{b.setPointerCapture(e.pointerId)}catch(_){}touch[k]=1;b.classList.add('on');startIfNeeded(k)};
  const off=e=>{e.preventDefault();touch[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(tut&&tut.phase==='msg'&&state==='play'&&!paused){const r=tut.skipR;if(r&&x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3])tutSkip();else tutConfirm();return}
  if(dlg&&dlg.pause&&state==='play'&&!paused&&dlg.armed&&dlg.pt>25){dlg=null;jumpPrev=true;return}
  if(dlg&&dlg.xr&&state==='play'&&!paused){const r=dlg.xr;if(x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3]){dlg=null;return}}
  if(paused){if(x>W*.25&&x<W*.75){if(y>112&&y<152)setPause(false);else if(y>164&&y<204)pauseToMenu()}return}
  if(state==='pages'&&x>W-80&&y<34){pagesSkip();return}
  if(state==='play'&&x>W-76&&x<W-46&&y<44){setPause(true);return}
  if(x>W-48&&y<44){toggleSnd();return}
  if(state==='title'&&splashT<=0&&y>120&&y<228&&(x<W*.36||x>W*.64)){pickLevel(x<W*.5?-1:1);return}
  startIfNeeded()});
addEventListener('contextmenu',e=>e.preventDefault());
const inp={
  l:()=>!!(keys.ArrowLeft||keys.KeyA||touch.l),
  r:()=>!!(keys.ArrowRight||keys.KeyD||touch.r),
  j:()=>!!(keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ||touch.j),
  s:()=>!!(keys.KeyX||keys.KeyJ||keys.KeyK||keys.ShiftLeft||touch.s)
};
function goFull(){
  if(!isTouch||document.fullscreenElement)return;
  try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'});
    if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});}catch(e){}
}

/* =================== sound =================== */
let ac;
function beep(f,d,type='square',v=.04){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;
    o.connect(gn);gn.connect(ac.destination);o.start();
    gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}
}

/* =================== audio manager (files are optional) =================== */
/* Drop files in assets/audio/music/<name>.ogg|mp3 and assets/audio/sfx/<name>.ogg|mp3.
   Missing files are fine: music stays silent and sound effects fall back to the built-in beeps. */
const AUD={on:true,go:false,m:null,cur:null,curKey:undefined,bufs:{},ready:{},prev:''};
try{AUD.on=localStorage.getItem('lungiman-snd')!=='0'}catch(e){}
function actx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}catch(e){return null}}
function audMaster(){const c=actx();if(!c)return null;if(!AUD.m){AUD.m=c.createGain();AUD.m.connect(c.destination)}AUD.m.gain.value=AUD.on?1:0;return AUD.m}
function loadBuf(key,dir){
  if(AUD.bufs[key])return AUD.bufs[key];
  const tryExt=ext=>fetch('assets/audio/'+dir+'/'+key+'.'+ext).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()});
  AUD.bufs[key]=(typeof fetch==='undefined'?Promise.resolve(null):tryExt('ogg').catch(()=>tryExt('mp3'))
    .then(a=>a&&new Promise((res,rej)=>{const c=actx();c?c.decodeAudioData(a,res,rej):rej()}))).then(b=>{if(b)AUD.ready[key]=b;return b||null}).catch(()=>null);
  return AUD.bufs[key];
}
function playMusic(key){
  if(AUD.curKey===key)return;AUD.curKey=key;
  const c=actx(),m=audMaster();if(!c||!m)return;
  const old=AUD.cur;
  if(old){const g=old.g.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.linearRampToValueAtTime(0,c.currentTime+.8);setTimeout(()=>{try{old.s.stop()}catch(e){}},900);AUD.cur=null}
  if(!key)return;
  loadBuf(key,'music').then(buf=>{
    if(!buf||AUD.curKey!==key)return;
    const s=c.createBufferSource(),g=c.createGain();s.buffer=buf;s.loop=true;g.gain.value=0;s.connect(g);g.connect(m);s.start();
    g.gain.linearRampToValueAtTime(.6,c.currentTime+.8);AUD.cur={s,g};
  });
}
function sting(key){
  const c=actx(),m=audMaster();if(!c||!m||!AUD.go)return;
  loadBuf(key,'music').then(buf=>{
    if(!buf)return;
    const s=c.createBufferSource(),g=c.createGain();s.buffer=buf;g.gain.value=.9;s.connect(g);g.connect(m);s.start();
    if(AUD.cur){const mg=AUD.cur.g.gain;mg.setTargetAtTime(.15,c.currentTime,.05);setTimeout(()=>{try{mg.setTargetAtTime(.6,c.currentTime,.4)}catch(e){}},Math.min(buf.duration,6)*1000)}
  });
}
function sfx(name){
  const b=AUD.ready[name],c=actx(),m=audMaster();if(!b||!c||!m)return false;
  const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.9;s.connect(g);g.connect(m);s.start();return true;
}
/* speaker icon, top right: waves when sound is on, red cross when muted. Tap area is bigger than the icon. */
function drawSndIcon(){
  const bx=W-34,by=10,c=AUD.on?'#cfe9c8':'#ff6a88',R=(x,y,w,h)=>g.fillRect(bx+x,by+y,w,h);
  g.fillStyle='rgba(18,10,28,.75)';R(0,0,26,22);g.fillStyle='#3a2c58';R(0,0,26,1);R(0,21,26,1);R(0,0,1,22);R(25,0,1,22);
  g.fillStyle=c;R(5,8,3,6);R(8,7,1,8);R(9,6,1,10);R(10,5,1,12);
  if(AUD.on){R(13,8,1,6);R(15,6,1,10);R(17,4,1,14)}
  else for(let i=0;i<6;i++){R(13+i,8+i,2,1);R(18-i,8+i,2,1)}
}
/* Thunder: assets/audio/sfx/thunder.ogg if present, otherwise a rumble of low-passed noise made in code. */
function thunder(big){if(sfx('thunder'))return;try{const c=actx(),m=audMaster();if(!c||!m||!AUD.on)return;const d=big?1.8:.8,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++){const t=i/n;a[i]=(Math.random()*2-1)*Math.pow(1-t,2.2)*(1+.6*Math.sin(i*.0009))}
  const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(big?900:600,c.currentTime);f.frequency.exponentialRampToValueAtTime(90,c.currentTime+d);
  const gn=c.createGain();gn.gain.value=big?.55:.3;src.connect(f);f.connect(gn);gn.connect(m);src.start()}catch(e){}}
/* Healing magic when a sacred tree blooms: assets/audio/sfx/heal_magic.ogg if present, otherwise a rising chime arpeggio made in code. */
function healSfx(){if(sfx('heal_magic'))return;[523,659,784,988,1319,1568].forEach((f,i)=>setTimeout(()=>{beep(f,.9,'sine',.045);beep(f*2,.7,'triangle',.02)},i*170))}
function startBloom(){bloomAt=tick;healSfx()}
/* Footsteps made in code (no files): a soft thud for the hero, a heavy one for charging bosses. */
function stepSfx(heavy){if(!AUD.on||!AUD.go)return;try{const c=actx(),m=audMaster();if(!c||!m)return;const d=heavy?.14:.06,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++){const t=i/n;a[i]=(Math.random()*2-1)*Math.pow(1-t,3)}
  const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=heavy?260:700;const gn=c.createGain();gn.gain.value=heavy?.5:.14;src.connect(f);f.connect(gn);gn.connect(m);src.start()}catch(e){}}
function toggleSnd(){AUD.on=!AUD.on;try{localStorage.setItem('lungiman-snd',AUD.on?'1':'0')}catch(e){}audMaster()}
const SFX_NAMES=['throw','hit','jump','vine','slash','die','chai','powerup','boss_roar','boss_roar_yakshi','boss_roar_chathan','boss_roar_odiyan','boss_roar_karinkanni','boss_roar_komban','yakshi_laugh','thunder','heal_magic','angel_descent','kannan_yell','bike_start','bike_loop'];
function wantMusic(){
  if(P&&P.fly)return null;
  if(state==='cine')return cin&&cin.k==='mk'?'bgm_finale':null;
  if(state==='pages'&&pg&&pg.list===EPILOGUE)return 'bgm_ending';
  if(state==='title'||state==='pages')return 'bgm_menu';
  if(state==='win'||state==='ending')return 'bgm_ending';
  if(state==='over'||state==='clear')return null;
  if(locked&&boss.active&&!boss.dead)return 'bgm_boss_'+(boss.t==='karin'?'karinkanni':boss.t);
  return LV[lvl].bgm||null;
}
/* ---- motorbike engine (Act II ride), synthesised: two detuned saws through a low-pass, pulsed like a single-cylinder thumper ---- */
let ENG=null,bikeT=0;
/* the real recording (350cc bike firing, Pixabay) cut into a start-up (bike_start) and a steady loop (bike_loop); the synthesised engine below is the fallback when the files are missing */
let ENGS=null;
function engineSamples(on,sp,t){try{const c=actx(),m=audMaster();if(!c||!m||!AUD.go)return false;const bs=AUD.ready.bike_start,bl=AUD.ready.bike_loop;if(!bs||!bl)return false;
  const E=ENGS||(ENGS={started:false,sg:null,loop:null,lg:null}),now=c.currentTime;if(t===0)E.started=false;
  if(on&&t<=2&&!E.started){E.started=true;const so=c.createBufferSource(),gn=c.createGain();so.buffer=bs;gn.gain.value=.5;so.connect(gn);gn.connect(m);so.start();E.sg=gn}
  if(!on&&E.sg)E.sg.gain.setTargetAtTime(0,now,.2);
  if(on&&t>150){if(!E.loop){const so=c.createBufferSource(),gn=c.createGain();so.buffer=bl;so.loop=true;gn.gain.value=0;so.connect(gn);gn.connect(m);so.start();E.loop=so;E.lg=gn}E.lg.gain.setTargetAtTime(.2+.08*sp,now,.4);E.loop.playbackRate.setTargetAtTime(.92+.2*sp,now,.3)}
  else if(E.loop){const lp=E.loop;E.lg.gain.setTargetAtTime(0,now,.2);setTimeout(()=>{try{lp.stop()}catch(e){}},900);E.loop=null;E.lg=null}
  return true}catch(e){return false}}
function engineSet(on,sp,t){if(engineSamples(on,sp,t))return;try{const c=actx(),m=audMaster();if(!c||!m||!AUD.go)return;
  if(!ENG){if(!on)return;const o1=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),amp=c.createGain(),out=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    o1.type='sawtooth';o2.type='sawtooth';o2.detune.value=14;f.type='lowpass';f.frequency.value=240;f.Q.value=3;amp.gain.value=.5;lfo.type='sine';lg.gain.value=.5;out.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(amp);amp.connect(out);out.connect(m);lfo.connect(lg);lg.connect(amp.gain);o1.start();o2.start();lfo.start();ENG={o1,o2,f,out,lfo}}
  const now=c.currentTime,rev=Math.max(0,1-t/100),freq=34+15*sp+60*Math.sin(Math.PI*Math.min(1,t/100))*rev,vol=on?(t<110?.085:.04+.012*sp):0;
  ENG.o1.frequency.setTargetAtTime(freq,now,.07);ENG.o2.frequency.setTargetAtTime(freq*1.004,now,.07);ENG.lfo.frequency.setTargetAtTime(7+7*sp+10*Math.sin(Math.PI*Math.min(1,t/100))*rev,now,.07);ENG.f.frequency.setTargetAtTime(200+90*sp+160*rev,now,.1);ENG.out.gain.setTargetAtTime(vol,now,on?.12:.25)}catch(e){}}
function engineTick(){const on=state==='play'&&!!LV[lvl].bike&&!P.fly&&!(dlg&&dlg.pause);if(state==='play'&&LV[lvl].bike&&!paused)bikeT++;else if(!(state==='play'&&LV[lvl].bike))bikeT=0;
  const sp=on?Math.max(0,Math.min(1,(P.vx-.9)/2.7)):0;engineSet(on,sp,bikeT)}
function audioTick(){
  engineTick();
  if(!AUD.go)return;
  playMusic(wantMusic());
  if(state!==AUD.prev){if(state==='clear')sting('sting_victory');if(state==='over')sting('sting_gameover');AUD.prev=state}
}

/* =================== pixel utilities =================== */
const TAU=Math.PI*2,BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay=(x,y)=>(BAY[((y&3)<<2)|(x&3)]+.5)/16;
const CM={};const rgbOf=h=>CM[h]||(CM[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
function buf(w,h,wrap){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d'),id=ctx.createImageData(w,h),d=id.data;
  const idx=(X,Y)=>{X=Math.round(X);Y=Math.round(Y);if(wrap)X=((X%w)+w)%w;if(X<0||Y<0||X>=w||Y>=h)return -1;return (Y*w+X)*4};
  return{c,w,h,
    set(X,Y,col){const i=idx(X,Y);if(i<0)return;const v=rgbOf(col);d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];d[i+3]=255},
    clear(X,Y){const i=idx(X,Y);if(i>=0)d[i+3]=0},
    has(X,Y){const i=idx(X,Y);return i>=0&&d[i+3]>0},
    done(){ctx.putImageData(id,0,0);return c}};
}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function disc(cx,cy,r,fn){cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.8)fn(cx+x,cy+y,x,y)}
function ell(b,cx,cy,rx,ry,cols){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++){if(x*x/(rx*rx)+y*y/(ry*ry)<=1.05){const s=-(x/rx*.5+y/ry)+(bay(cx+x&255,cy+y&255)-.5)*.5;b.set(cx+x,cy+y,s>.5?cols[2]:s>-.3?cols[1]:cols[0])}}}
function rect(b,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)b.set(x+i,y+j,c)}
function bands(b,cols,y0,y1){for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0-1)*(cols.length-1),i=Math.min(cols.length-2,Math.floor(t)),f=t-i;for(let x=0;x<b.w;x++)b.set(x,y,f>bay(x,y)?cols[i+1]:cols[i])}}
function outline(b,col){const pts=[];for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++)if(!b.has(x,y)&&(b.has(x+1,y)||b.has(x-1,y)||b.has(x,y+1)||b.has(x,y-1)))pts.push([x,y]);pts.forEach(([x,y])=>b.set(x,y,col))}
function strS(rows,pal){const w=rows[0].length,h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<w;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});return c}
function flipC(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return n}
function tint(c,col){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return n}

/* =================== pixel font =================== */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','!':'010010010000010','.':'000000000000010','-':'000000111000000',',':'000000000010100',"'":'010010000000000'};
/* Story text (dialogue, scenes, captions, ending) is drawn with a normal font on a second, full-resolution canvas laid over the game, so it stays sharp and readable on a phone.
   Everything else keeps the pixel font. ntext() only queues; flushText() paints after the frame. */
const tcv=document.getElementById('t'),tg=tcv.getContext('2d'),TQ=[],TFONT='"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';

/* ALL CAPS data text -> sentence case ("THE FOREST IS RESTLESS." -> "The forest is restless.") */

  for(const n of NAMES)t=t.replace(new RegExp('(^|[^a-z])'+n.toLowerCase()+'(?![a-z])','gi'),(m,a)=>a+n);return t}

function tmeasure(s,px){tg.font=tfont(px,1);return tg.measureText(s).width}
/* wrap into at most maxLines lines of width maxW (internal px); the font shrinks a little if it does not fit */

function ptext(s,x,y,sc,col,align='left',sh='#120a1c'){

function genJungle(L,seed){const J=L.jung,b=buf(480,GY+12,true),r=rng(23+seed);

    for(let k=0;k<5;k++)for(let x=0;x<480;x+=5){const yy=T(x)+5+k*13;
      disc(x,yy,6,(X,Y,dx,dy)=>{if(Y<T(X)-1)return;const s=-(dx*.4+dy)/6+(bay(X&255,Y)-.5)*.6;b.set(X,Y,s>.5?J.hl:s>-.1?J.mid:J.base)})}

    for(const [x,cy] of trees){const w=4+(r()*3|0);for(let y=Math.round(cy);y<GY+12;y++)for(let k=0;k<w;k++)b.set(x-(w>>1)+k,y,k===0?J.vine:J.trunk)}

      disc(bx,by,rr,(X,Y,dx,dy)=>{const s=-(dx*.5+dy)/rr+(bay(X&255,Y)-.5)*.7+(hash(X,Y)-.5)*.25;b.set(X,Y,s>.6?J.hl:s>.05?J.mid:J.base)})}}
    for(const [x,cy,rad] of trees){const nv=2+(r()*3|0);for(let k=0;k<nv;k++){const vx=x+(r()-.5)*rad*1.6|0,vy=cy+rad*.3|0,len=10+r()*30|0;

    else if(p.k==='aru'){g.fillStyle='rgba(255,255,255,'+(.12+.1*Math.sin(tick*.12))+')';g.fillRect(px-3,py-3,16,16);{const st=ART.tdrops_0;if(st)g.drawImage(st,px-6,py-2);else g.drawImage(ARU,px,py)}}else if(p.k==='bell'){glowEll(px+5,py+5,13,13,'#ffd860',.32+.12*Math.sin(tick*.12));g.fillStyle='#8a5a20';g.fillRect(px+1,py+3,8,7);g.fillRect(px+2,py+1,6,3);g.fillStyle='#d8a838';g.fillRect(px+2,py+3,2,6);g.fillRect(px+3,py+1,4,1);g.fillStyle='#fff0b0';g.fillRect(px+2,py+3,1,3);g.fillStyle='#3a2410';g.fillRect(px+4,py+10,2,2)}
  else if(p.k==='rice'){glowEll(px+5,py+6,12,10,'#f4ecd0',.22+.1*Math.sin(tick*.1));g.fillStyle='#2e7a2e';g.fillRect(px-1,py+6,12,4);g.fillStyle='#4aa040';g.fillRect(px,py+6,10,1);g.fillStyle='#f8f4e8';g.fillRect(px+2,py+3,6,4);g.fillRect(px+3,py+2,4,1)}
  else{const po=ART.porotta_0;if(po){glowEll(px+5,py+5,12,9,'#ffd890',.2+.08*Math.sin(tick*.1));g.drawImage(po,px-4,py-1+Math.round(Math.sin(tick*.08)))}else g.drawImage(PICK,px-2,py-1)}}
  for(const e of enemies)if(e.alive&&e.x-cx<W+20&&e.x-cx>-40)drawFoe(e,cx);
  drawCameos(cx);drawSacredTree(cx);if(!(state==='cine'&&cin&&cin.k==='mk'))drawBoss(cx);drawCine(cx);
  if(boss.dead&&boss.drop&&!(state==='cine'&&cin&&cin.t<66)){const q=Math.round(boss.drop.x-cx);if(boss.t==='chathan')g.drawImage(COCO,q-3,GY-7);else{g.fillStyle='#0a0810';g.fillRect(q-14,GY-2,28,2);g.fillRect(q-9,GY-3,18,1);g.fillStyle='#6a4a90';g.fillRect(q-5,GY-2,3,1)}}
  for(const s of shots)drawShot(s,cx);
  for(const b of bullets)g.drawImage(COCO,Math.round(b.x-cx-3),Math.round(b.y-3));
  for(const p of parts){g.fillStyle=p.c;g.fillRect(Math.round(p.x-cx),Math.round(p.y),2,2)}
  drawRings(cx);
  if(P&&state!=='title'){drawPlayer(cx);drawSlash(cx);if(state==='scene'&&scene&&scene.t>=1340){const ax=Math.round(P.x-cx)+7,ay=Math.round(P.y)+14;glowEll(ax,ay,20,26,'#ffe070',.32+.1*Math.sin(tick*.15));glowEll(ax,ay,11,16,'#fff6d0',.25)}}
  if(L.key==='a4')drawRisingWater(cx);
  if(!L.arena)drawMotes(L,cx);
  if(L.rain&&!(cin&&cin.k==='pt')){const rk=bloomAt>=0?Math.min(1,(tick-bloomAt)/150):0;g.fillStyle='rgba(180,210,220,'+(.45*(1-rk)).toFixed(2)+')';for(let i=0;i<70;i++){const x=((i*53+tick*4)%(W+60))-30,y=((i*97+tick*9)%(H+30))-15;g.fillRect(Math.round(x),Math.round(y),1,5);g.fillRect(Math.round(x)-1,Math.round(y)+5,1,3)}
    if(tick%520<5){g.fillStyle='rgba(220,240,255,.16)';g.fillRect(0,0,W,H)}}
  tile(A.canopy,1.25,cx);drawBikeCanopy(cx);
  g.restore();

  if(state!=='title'&&state!=='cine'){
    ptext('SCORE '+String(score).padStart(6,'0'),10,10,2,'#ffffff');
    for(let i=0;i<lives;i++)g.drawImage((goldLamp()?LAMPG:LAMP)[((tick>>4)+i)%2],10+i*10,24);
    ptext(LV[lvl].act,10,36,1,'#d8d0e8');
    ptext(P.aru?'TRISHUL':P.sp?'PAROTTA X3  '+ammo:'COCONUT  '+ammo,10,46,1,P.aru?'#ffe898':ammo<=5?'#ff9a80':'#c8b890');
    if(P.rev>0)ptext('DIZZY! CONTROLS FLIPPED',W/2,36,1,'#ff9ac0','center');
    if(P.freeze>0)ptext('PARALYZED!',W/2,36,1,'#9aff60','center');
    if(LV[lvl].prints)ptext('PRINTS '+prints+'/'+LV[lvl].prints,10,56,1,'#d8b0ff');
    if(blessing)ptext('BLESSED',10,56+(LV[lvl].prints?10:0),1,'#ffe070');
    if(locked&&boss.active&&!boss.dead){const bw=Math.min(200,W-160),bx=Math.round(W/2-bw/2);
      ptext(boss.name,W/2,12,1,'#ffb0a0','center');g.fillStyle='#120a1c';g.fillRect(bx-1,20,bw+2,7);
      g.fillStyle='#5a1a20';g.fillRect(bx,21,bw,5);g.fillStyle='#e8402e';g.fillRect(bx,21,Math.round(bw*boss.hp/boss.max),5);g.fillStyle='#ff9a80';g.fillRect(bx,21,Math.round(bw*boss.hp/boss.max),1)}
  }
  drawDlg();
  if(fadeT>0){const a=Math.min(1,fadeT/90);g.globalAlpha=a;g.fillStyle=fadeCol||(a>.55?'#ffffff':'#ff9af0');g.fillRect(0,0,W,H);g.globalAlpha=1}
  if(flashT>0){g.globalAlpha=Math.min(.75,flashT/14);g.fillStyle=flashC;g.fillRect(0,0,W,H);g.globalAlpha=1}
  drawTut();drawSndIcon();if(state==='play')drawPauseIcon();
  if(banner&&state!=='title'&&!(tut&&tut.phase==='msg')){const bY=(state==='clear'&&TREE_OF[LV[lvl].boss]!==undefined)?14:78;g.fillStyle='rgba(12,8,28,.55)';g.fillRect(0,bY,W,48);ptext(banner.a,W/2,bY+8,4,'#f0c040','center');if(banner.b)ntext(nice(banner.b),W/2,bY+30,12,'#f4ecd0','center')}
  if(state==='title'){overlay();drawCover();
    const lg=ART.logo_0,hi=ART.logo_hi;
    if(hi){const lw=Math.min(W-30,312),lh=lw*hi.height/hi.width;nimg(hi,(W-lw)/2,3+Math.sin(tick*.04)*1.5,lw,lh)}
    else if(lg){g.drawImage(lg,Math.round((W-lg.width)/2),4+Math.round(Math.sin(tick*.04)*1.5))}
    else{ptext('KANNAN',W/2,24,7,'#f0c040','center');ptext('AND THE',W/2,66,2,'#f4ecd0','center');ptext('KANJIRAVANAM CHRONICLES',W/2,82,3,'#ffe58a','center');ptext('KANNAN MUST SEAL THE PORTAL.',W/2,114,2,'#f4ecd0','center')}
    {const pk=pick<0?pickDefault():pick,L=LV[pk],sh=(tick>>4)%2;
      for(const d of [-1,1]){const on=d<0?pk>0:pk<pickMax(),ax=Math.round(W/2+d*Math.min(140,W*.33))+(on?d*sh*3:0),ay=166;g.fillStyle='#120a1c';for(let i=-1;i<16;i++)g.fillRect(ax-d*i-d,ay-i-2,1,i*2+5);g.fillStyle=on?'#ffe58a':'#4a4060';for(let i=0;i<14;i++)g.fillRect(ax-d*i,ay-i,1,i*2+1)}
      ptext(L.act||'PROLOGUE',W/2,148,3,'#ffe58a','center');ptext(L.name||'',W/2,172,1,'#f4ecd0','center');
      if((tick>>5)%2===0)ptext(isTouch?'TAP TO START':'PRESS SPACE TO START',W/2,192,2,'#cfe9c8','center')}
    if(!isTouch)ptext('LEFT RIGHT CHOOSE   SPACE JUMP   X THROW',W/2,222,1,'#b8b0d0','center');
  }
  if(state==='over'){overlay();ptext('GAME OVER',W/2,80,5,'#e8402e','center');ptext('SCORE '+score,W/2,112,2,'#f4ecd0','center');ptext('BEST '+Math.max(hi,score),W/2,130,2,'#ffe58a','center');if(lockT<=0)ptext(isTouch?'TAP TO CONTINUE':'PRESS ANY KEY',W/2,160,2,'#cfe9c8','center')}
  if(state==='win'){overlay();ptext('PORTAL SEALED!',W/2,70,5,'#f0c040','center');ptext('KANNAN SAVED KANJIRAVANAM.',W/2,108,2,'#f4ecd0','center');ptext('SCORE '+score+(score>=hi?'  NEW BEST':''),W/2,126,2,'#cfe9c8','center');if(lockT<=0)ptext(isTouch?'TAP TO PLAY AGAIN':'PRESS ANY KEY',W/2,156,2,'#ffe58a','center')}
  if(splashT>0)drawSplash();
}

/* =================== splash + loading =================== */
/* Studio splash with a real loading bar (sounds and the menu music). Any tap or key skips it. Drawn over the title screen. */
let logoC=null;
if(typeof Image!=='undefined'){const im=new Image();
  im.onload=()=>{logoC=im};
  im.src='assets/art/moonga-logo.png'}
const SPLASH_T=170;let splashT=SPLASH_T,preN=0,preDone=0;
try{const list=SFX_NAMES.map(n=>[n,'sfx']).concat([['bgm_menu','music']]);preN=list.length;
  list.forEach(([k,d])=>loadBuf(k,d).then(()=>preDone++,()=>preDone++))}catch(e){preN=0}
function drawSplash(){
  TQ.length=0; /* the splash covers everything: drop the text queued by the title or game underneath */
  const t=SPLASH_T-splashT,a=Math.max(0,Math.min(1,t/30,splashT/30));
  g.globalAlpha=1;g.fillStyle='#0a0814';g.fillRect(0,0,W,H);
  g.globalAlpha=a;
  if(logoC){const ls=Math.min(108,Math.round(H*.4));nimg(logoC,Math.round(W/2-ls/2),Math.round(H*.07),ls,ls)}
  ntext('Moonga Studio',W/2,150,26,'#f0c040','center');
  ntext('presents',W/2,186,13,'#d8d0f0','center');
  if(preN&&preDone<preN){const bw=120,bx=Math.round(W/2-bw/2);g.fillStyle='#120a1c';g.fillRect(bx-1,222,bw+2,7);g.fillStyle='#3a2c58';g.fillRect(bx,223,bw,5);g.fillStyle='#e8a830';g.fillRect(bx,223,Math.round(bw*preDone/preN),5);ptext('LOADING',W/2,234,1,'#b8b0d0','center')}
  g.globalAlpha=1;
}
/* title cover: glowing red eyes in the dark trees and Kannan walking in place */
const EYES=[[.08,.2],[.18,.42],[.86,.25],[.93,.5],[.78,.42],[.14,.6]];
function drawCover(){
  EYES.forEach(([fx,fy],i)=>{const ph=(tick+i*37)%260;if(ph>210)return;const x=Math.round(fx*W),y=Math.round(fy*H),p=.55+.35*Math.sin(tick*.08+i);
    g.fillStyle='rgba(255,58,42,'+(p*.22).toFixed(2)+')';g.fillRect(x-3,y-3,13,7);g.fillStyle='rgba(255,58,42,'+p.toFixed(2)+')';g.fillRect(x,y-1,2,2);g.fillRect(x+6,y-1,2,2)});
  const sp=ART.logo_0?null:PSPR[((tick>>3)%2)?'a0':'b0'];if(sp){const s=sp[0],sc=2;g.drawImage(s,0,0,s.width,s.height,28,GY-s.height*sc+4,s.width*sc,s.height*sc)}
}

/* =================== screen fit =================== */
function fit(){
  const vw=innerWidth,vh=innerHeight;
  W=Math.max(400,Math.min(640,Math.round(H*vw/vh/2)*2));
  cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;
  const s=Math.min(vw/W,vh/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  if(A){A.sky=genSky(LV[lvl]);A.pit=genPit(LV[lvl])}
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
fit();loadLevel(0);

let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(t-last,100);last=t;while(acc>=16.667){if(!paused)update();acc-=16.667}if(!paused)audioTick();else engineSet(false,0,999);draw();if(paused){TQ.length=0;drawPause()}flushText()}
requestAnimationFrame(loop);
</script>
